<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>buscador de filmes</title>
    <link rel="stylesheet" href="estilos/outros.css" media="screen and (min-width: 791px)">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <header>
        <div>
            <i class="fa-solid fa-film"></i>
            <h1>Buscador de <span>Filmes</span></h1>
        </div>
        <p>Encontre seus filmes favoritos de forma rápida e fácil!</p>
        <div id="divinf">
            <i class="fa-solid fa-magnifying-glass-minus"></i>
            <input type="text" name="nomefilme" id="nomefilme" placeholder="Digite o nome de um filme...">
            <button>Buscar</button>
        </div>
    </header>
    <main style="display: none;">
        <h2 id="resultadosnome">Resultados da busca:</h2>
        <div id="cartaz" style="display: none;">
            <img src="images.jpg" alt="">
            <div id="infos">
                <h2 id="nomefilme">Interestelar</h2>
                <p id="anofilme">2014</p>
                <div id="caracteristicas">
                    <i class="fa-solid fa-film"></i>
                    <p id="coisas">Aventura, Drama, Ficção Cientifica</p>
                </div>
                <div id="nota">
                    <i class="fa-solid fa-star"></i>
                    <p id="pnota">8.6</p>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>© 2026 <a href="https://github.com/hugorocha-web" target="_blank">Hugo Rocha</a> • Desenvolvido com HTML, CSS e JavaScript.</p>
    </footer>
    <script src="index.js"></script>
</body>
</html>
